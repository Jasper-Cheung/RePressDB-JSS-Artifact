[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repressdb-artifact"
version = "1.0.0"
description = "Reference implementation and reproducibility artifact for RePressDB"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "psutil==7.2.2",
  "lz4==4.4.5",
  "zstandard==0.25.0",
  "matplotlib==3.10.6"
]

[tool.setuptools.packages.find]
where = ["src"]
